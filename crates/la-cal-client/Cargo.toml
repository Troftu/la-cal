[package]
name = "la-cal-client"
version = "0.1.0"
edition = "2024"
description = "Cloneable asynchronous typed OMS 2.5 OWP client"
license = "Apache-2.0"
repository = "https://github.com/Troftu/la-cal"
keywords = ["oms", "uci", "cal", "owp"]
categories = ["network-programming"]
readme = "../../README.md"

[dependencies]
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
owp-types = { path = "../owp-types" }
tokio = { version = "1.53.2", features = ["net", "rt", "sync", "time", "macros"] }
tokio-tungstenite = "0.30"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }

[lints]
workspace = true
