[package]
name = "demo-driver"
version = "0.1.0"
edition = "2024"
description = "Native LA-CAL demonstration configuration and process-owning driver"
license = "Apache-2.0"
repository = "https://github.com/Troftu/la-cal"
keywords = ["oms", "uci", "cal", "demo"]
categories = ["network-programming"]
readme = "../../README.md"

[dependencies]
futures-util = "0.3"
la-cal-client = { path = "../la-cal-client" }
owp-types = { path = "../owp-types" }
serde_json = "1"
tokio = { version = "1.53.2", features = ["full"] }
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
toml = "1.1.6"
uuid = "1"

[lints]
workspace = true
